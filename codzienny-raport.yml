name: Codzienny raport cen (dane.gov.pl)

on:
  schedule:
    # Godziny w UTC. 00:17 UTC = 01:17 zimą / 02:17 latem w Polsce (przed nocnym pobraniem przez dane.gov.pl).
    # Drugie uruchomienie to zabezpieczenie na wypadek opóźnień GitHuba (jest bezpieczne – nic nie dubluje).
    - cron: "17 0 * * *"
    - cron: "47 1 * * *"
  workflow_dispatch: {}   # przycisk "Run workflow" do ręcznego uruchomienia

permissions:
  contents: write   # zapis historii cen w repozytorium
  pages: write      # publikacja na GitHub Pages
  id-token: write

concurrency:
  group: raport-cen
  cancel-in-progress: false

jobs:
  raport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja
        run: pip install openpyxl==3.1.5

      - name: Generowanie cennika, XML i MD5
        id: gen
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          PAGES_URL: ${{ vars.PAGES_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          set +e
          python generator/generuj.py
          kod=$?
          echo "kod=$kod" >> "$GITHUB_OUTPUT"
          # 0 = OK, 3 = opublikowano kopię awaryjną (commit i tak robimy), inne = błąd
          if [ "$kod" != "0" ] && [ "$kod" != "3" ]; then exit $kod; fi

      - name: Zapis i publikacja
        run: |
          git config user.name "raport-cen-bot"
          git config user.email "raport-cen-bot@users.noreply.github.com"
          git add docs stan
          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
          else
            git commit -m "Raport cen $(TZ=Europe/Warsaw date +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Alarm – arkusz był niedostępny
        if: steps.gen.outputs.kod == '3'
        run: |
          echo "::error::Arkusz Google był niedostępny. Opublikowano kopię ostatniego cennika. Sprawdź udostępnianie arkusza."
          exit 1
